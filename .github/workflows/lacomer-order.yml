name: Robot de pedido La Comer

# Corre el pedido automático en La Comer (Playwright) fuera de Vercel, que no puede correr un
# navegador real. Dos formas de disparar esto:
#
#  1. Programado (cron): corre todos los días para cada usuario que activó "Pedido automático
#     programado" en Configuración.
#  2. Manual / por click ("workflow_dispatch"): corre para un solo usuario. Lo dispara la app
#     web (botón "Pedir en La Comer") vía la API de GitHub, pasando el userId de quien lo pidió;
#     también se puede correr a mano desde la pestaña Actions de este repo.
#
# ⚠️ IMPORTANTE (2026-09-02): este job corre en un runner AUTOHOSPEDADO (self-hosted), no en el
# runner de nube de GitHub (ubuntu-latest) que se usaba antes. lacomer.com.mx usa Cloudflare. Ver
# la sección "Dónde corre el robot en producción" en el README para cómo dar de alta el runner
# autohospedado en tu propia Mac.
#
# Cloudflare bloqueaba (página "Sorry, you have been blocked") incluso ya corriendo desde la
# propia Mac con IP residencial — confirmado viendo el HTML real que devolvía en vez del sitio.
# No era la IP: era el fingerprint del navegador automatizado (Playwright/Chromium headless), y
# el bloqueo pasaba en la carga inicial del sitio, antes de siquiera intentar el login. Por eso
# LACOMER_HEADFUL=true aquí abajo — corre con el navegador visible (posible porque el runner vive
# en la sesión gráfica de tu Mac, algo que el runner de nube nunca tuvo) en vez de headless, que
# suele ser suficiente para pasar el challenge de Cloudflare.
on:
  # ⏸️ PAUSADO (2026-09-02): el cron diario queda comentado a propósito. Automatizar compras
  # contra lacomer.com.mx implica evadir su protección anti-bot (Cloudflare) para lograr que
  # cargue, y no está claro qué tan de acuerdo es eso con sus Términos y Condiciones — se decidió
  # esperar a buscar una integración real con ellos (o alguien más) en vez de seguir insistiendo
  # por este camino. El botón manual y el runner siguen configurados para cuando se retome, pero
  # nada debe correr solo mientras tanto.
  # schedule:
  #   # 13:00 UTC = 07:00 CDMX en horario estándar (UTC-6) / 08:00 en horario de verano (UTC-5).
  #   - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      userId:
        description: "ID del usuario a pedir (vacío = todos los que activaron el pedido programado)"
        required: false
        type: string
      dryRun:
        description: "Simular sin abrir navegador real (para probar el flujo sin tocar lacomer.com.mx)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pedido:
    # Tu propia Mac, dada de alta como runner autohospedado (ver README) — no un runner de nube
    # de GitHub, para evitar el bloqueo de Cloudflare a IPs de datacenter.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      LACOMER_DRY_RUN: ${{ github.event.inputs.dryRun == 'true' && 'true' || 'false' }}
      TARGET_USER_ID: ${{ github.event.inputs.userId }}
      LACOMER_HEADFUL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # Sin --with-deps: esa bandera solo instala paquetes de sistema vía apt-get (Linux/Debian),
      # no aplica en macOS — ahí el navegador que descarga Playwright ya viene autocontenido.
      - name: Instalar navegador de Playwright
        run: npx playwright install chromium

      - name: Correr el robot de pedido
        run: npm run lacomer:order

      - name: Subir captura/HTML de diagnóstico si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lacomer-diagnostics
          path: lacomer-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
